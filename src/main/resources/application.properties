server.port=8085
spring.application.name=it-asset-management

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:itamdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Springdoc OpenAPI & Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Optional Local Secrets (e.g. from secrets.properties, not committed to git)
spring.config.import=optional:file:secrets.properties

# ==============================================================
# SMTP / EMAIL CONFIGURATION (Direct Project Settings)
# ==============================================================
# Change host to your provider (e.g. smtp.gmail.com, smtp.office365.com, mail.bmconsulting.co)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:dhiraj@bmconsulting.co}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8

# SMTP Connection Security Settings
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Custom ITAM Sender Details
itam.mail.enabled=true
itam.mail.from-email=dhiraj@bmconsulting.co
itam.mail.from-name=Aegis IT Asset Management


