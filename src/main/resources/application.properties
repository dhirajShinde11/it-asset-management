server.port=8085
server.address=0.0.0.0
spring.application.name=it-asset-management

# ==============================================================
# Server Host / IP Configuration (Automatic Dynamic Discovery)
# ==============================================================
# Leave blank for 100% automatic zero-config network detection whenever your Wi-Fi/IP changes:
itam.server.host=

# Optional Local Secrets (e.g. from secrets.properties, not committed to git)
spring.config.import=optional:file:secrets.properties

# ==============================================================
# Persistent MySQL Database Configuration (XAMPP / Production)
# ==============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/itam_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=AegisHikariCP

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HTTP GZIP Compression Optimization (Reduces network transfer by 80%+)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Embedded Tomcat Performance & Concurrency Tuning
server.tomcat.threads.max=150
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=4000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=15000

# Static Web Resources Optimization (Browser caching and chain caching)
spring.web.resources.cache.period=3600
spring.web.resources.chain.cache=true

# Springdoc OpenAPI & Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ==============================================================
# SMTP / EMAIL CONFIGURATION (Direct Project Settings)
# ==============================================================
# Change host to your provider (e.g. smtp.gmail.com, smtp.office365.com, mail.bmconsulting.co)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:dhiraj@bmconsulting.co}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8

# SMTP Connection Security Settings
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Custom ITAM Sender Details
itam.mail.enabled=true
itam.mail.from-email=dhiraj@bmconsulting.co
itam.mail.from-name=Aegis IT Asset Management